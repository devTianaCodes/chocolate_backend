name: Backend Tests

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'
      - 'README.md'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      PORT: 3001
      CLIENT_URL: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: chocolate_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test
      SMTP_SERVICE: gmail
      SMTP_USER: ci@example.com
      SMTP_PASS: app-password-placeholder
      SMTP_FROM: Chocolate Craft House <ci@example.com>

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Run backend coverage
        run: npm run test:coverage

      - name: Enforce overall backend source coverage
        run: npm run test:coverage:overall -- --threshold 80

      - name: Enforce changed backend coverage
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run test:coverage:changed -- --threshold 90
